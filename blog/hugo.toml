baseURL = "https://blog.drdplus.info/"
locale = "cs"
defaultContentLanguage = "cs"
title = "Dračí odkaz"
disableKinds = ["taxonomy", "term"]

# Presentation comes from the md-publisher submodule.
theme = ["blog-classic"]
themesDir = "../md-publisher/modules"

# Statie used directories like /blog/2018/05/03/slug/ — match that.
[permalinks]
  blog = "/blog/:year/:month/:day/:slug/"

# Pretty URLs (trailing slash) and home RSS.
[outputs]
  home = ["HTML", "RSS", "SearchIndex"]
  section = ["HTML"]
  page = ["HTML"]

# Serve home RSS at /rss.xml (default would be /index.xml).
[outputFormats.RSS]
  baseName = "rss"

# Client-side search index, built at /search-index.json.
[outputFormats.SearchIndex]
  mediaType = "application/json"
  baseName = "search-index"
  isPlainText = true
  notAlternative = true

[params]
  googleAnalyticsId = "UA-121206931-15"
  dateFormat = "2. 1. 2006"
  dayMonthFormat = "2. 1."
  description = "Na co jsme přišli během vývoje Dračím odkazu"
  rssTitle = "Blog o Dračím odkazu"
  author = "DrdPlus.info"
  twitterSite = "@draciodkaz"
  ogLocale = "cs_CZ"
  searchDomain = "blog.drdplus.info"
  searchPlaceholder = "Hledej..."
  footerHtml = '<span class="hidden-sm-down">Kódy skladujeme na <a href="https://github.com/drdplusinfo">GitHubu</a></span>'
  notFoundTitle = "Tady nic není 😢"
  notFoundText = 'Zkus <a href="/">hlavní stránku</a> nebo nás <a href="/kontakt/">kontaktuj</a>'

  [[params.menu]]
    name = "Blog"
    id = "blog"
    url = "/"

  [[params.menu]]
    name = "Kontakty"
    id = "kontakt"
    url = "/kontakt/"

  [[params.menu]]
    name = "www.drdplus.info"
    url = "https://www.drdplus.info"
    hideOnSmall = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    endLevel = 3
    ordered = false
    startLevel = 2
